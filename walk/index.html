<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6fa"><title>玧其 · 走路测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#e1e7ef;color:#22334b;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}main{max-width:460px;margin:auto;background:#f7f8fb;min-height:100dvh;padding:22px 17px 26px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #263950;padding-bottom:13px}h1{font-size:18px;margin:0;font-weight:650}header span{font-size:10px;background:#2a4c77;color:white;padding:6px 8px}.intro{font-size:12px;color:#6e7b8c;line-height:1.8;margin:16px 0}.stage{position:relative;border:2px solid #71849d;background:#f0f3f6;box-shadow:3px 3px #c8d2df;overflow:hidden}canvas{width:100%;display:block;image-rendering:pixelated;touch-action:none}.stage-label{position:absolute;top:12px;left:12px;font-size:10px;letter-spacing:2px;color:#8d9aab;pointer-events:none}#state{position:absolute;bottom:12px;left:12px;background:#fff;padding:6px 8px;font-size:11px;border:1px solid #cbd3de;pointer-events:none}.under{display:flex;align-items:center;justify-content:space-between;margin:17px 0 11px}.under strong{font-size:12px;font-weight:500}#auto{background:#fff;border:1px solid #9aaac0;padding:8px 10px;font-size:11px}#auto.on{background:#294f7c;color:#fff;border-color:#294f7c}.control-area{display:flex;align-items:center;gap:30px;padding:10px 4px 17px;border-bottom:1px solid #ccd4df}.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,36px);gap:3px}.dpad button{background:#fff;border:1px solid #93a5bc;box-shadow:0 2px #c3cfdf;font-size:17px;touch-action:none;user-select:none}.dpad button.pressed{background:#2b527e;color:white;box-shadow:none;transform:translateY(2px)}.dpad [data-dir=up]{grid-column:2}.dpad [data-dir=left]{grid-row:2;grid-column:1}.dpad [data-dir=right]{grid-row:2;grid-column:3}.dpad [data-dir=down]{grid-row:3;grid-column:2}.dpad #stop{grid-row:2;grid-column:2;font-size:10px;background:#dce4ef}.control-copy{font-size:11px;color:#7d8998;line-height:2;margin:0}.settings{margin-top:19px}.slider-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:12px}input[type=range]{width:100%;accent-color:#2a507c;height:20px;cursor:pointer}.range-labels{display:flex;justify-content:space-between;font-size:10px;color:#8793a3;margin-top:3px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:10px;color:#8994a4}.bottom button{background:none;border:0;color:#365c86;font-size:11px;padding:7px}#error{color:#a34343;font-size:12px}button:focus-visible{outline:2px solid #315b8e;outline-offset:3px}@media(min-width:600px){main{margin:25px auto;border:1px solid #aebdd0;min-height:0}}@media(max-width:350px){.control-area{gap:15px}main{padding:15px 12px}}
</style></head><body><main><header><h1>玧其 · 走路测试</h1><span>动作小样 03</span></header><p class="intro">先点小人选中，再点地面让他走过去。<br>按住拖动，松手直接放下；放在家具上会回到原位。</p><section class="stage"><canvas id="field" width="400" height="380" aria-label="走路测试场地，先点玧其选中再点地面，也可以拖动指定目标"></canvas><div class="stage-label">WALK TEST</div><div id="state" role="status">正在加载小人…</div></section><p id="error" hidden></p><div class="under"><strong id="selection">未选中</strong><button id="auto">自己走一会儿</button></div><div class="control-area"><div class="dpad" aria-label="方向控制"><button data-dir="up" aria-label="向后走">↑</button><button data-dir="left" aria-label="向左走">←</button><button id="stop" aria-label="停止">停</button><button data-dir="right" aria-label="向右走">→</button><button data-dir="down" aria-label="向前走">↓</button></div><p class="control-copy">蓝圈表示选中了谁。<br>拖动松手直接放下。<br>方向键也能控制走动。</p></div><div class="settings"><div class="slider-head"><label for="speed">移动速度</label><span id="speed-value">正常 · 100%</span></div><input id="speed" type="range" min="65" max="145" value="100" step="5"><div class="range-labels"><span>慢一点</span><span>快一点</span></div></div><div class="bottom"><span>点地面走路，会绕开桌子和柜子</span><button id="size">放大看看 ×1.5</button></div></main><script src="walk.js"></script></body></html>
